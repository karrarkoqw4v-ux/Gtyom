name: Build Alfarabi APK
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-yweuvu, claude/hala-c5per7, main]
    paths: ["alfarabi/**", ".github/workflows/alfarabi.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Copy web app into assets
        run: |
          mkdir -p alfarabi/android/app/src/main/assets
          cp -r alfarabi/www/. alfarabi/android/app/src/main/assets/
      - name: Build debug APK
        working-directory: alfarabi/android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Commit APK to repo
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' alfarabi/android/app/build.gradle.kts)
          mkdir -p alfarabi/dist
          rm -f alfarabi/dist/*.apk
          cp alfarabi/android/app/build/outputs/apk/debug/app-debug.apk "alfarabi/dist/alfarabi-v$V.apk"
          C=$(grep -oP 'versionCode = \K[0-9]+' alfarabi/android/app/build.gradle.kts)
          SHA=$(sha256sum "alfarabi/dist/alfarabi-v$V.apk" | cut -d' ' -f1)
          SZ=$(stat -c%s "alfarabi/dist/alfarabi-v$V.apk")
          printf '{"versionCode":%s,"versionName":"%s","url":"https://github.com/karrarkoqw4v-ux/Gtyom/raw/%s/alfarabi/dist/alfarabi-v%s.apk","sha256":"%s","size":%s}\n' "$C" "$V" "$GITHUB_REF_NAME" "$V" "$SHA" "$SZ" > alfarabi/dist/latest.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A alfarabi/dist
          git commit -m "Build: update Alfarabi APK v$V [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
