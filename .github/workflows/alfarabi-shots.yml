name: Alfarabi native screenshots
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-yweuvu]
    paths: ["alfarabi/android/**", ".github/workflows/alfarabi-shots.yml"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Copy web assets (needed by the app module)
        run: |
          mkdir -p alfarabi/android/app/src/main/assets
          cp -r alfarabi/www/. alfarabi/android/app/src/main/assets/
      - name: Render native screens
        working-directory: alfarabi/android
        run: gradle testDebugUnitTest -Proborazzi.test.record=true --no-daemon --stacktrace
      - name: Commit screenshots
        run: |
          mkdir -p alfarabi/shots
          find alfarabi/android -name "native_*.png" -exec cp {} alfarabi/shots/ ; ; ls -la alfarabi/shots
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A alfarabi/shots
          git commit -m "Native screenshots [skip ci]" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
