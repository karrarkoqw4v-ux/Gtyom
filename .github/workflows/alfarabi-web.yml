name: Deploy Alfarabi Web
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-yweuvu, claude/hala-c5per7]
    paths: ["alfarabi/www/**", "alfarabi/web-src/**", "alfarabi/make-web.sh", ".github/workflows/alfarabi-web.yml"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: WEB_PREFIX=/Gtyom sh alfarabi/make-web.sh
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: alfarabi/web }
      - id: d
        uses: actions/deploy-pages@v4
