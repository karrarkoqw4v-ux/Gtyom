name: Build Khartkum APK
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-yweuvu, main]
    paths: ["web/**", "android/**", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Copy web app into assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r web/. android/app/src/main/assets/
          rm -f android/app/src/main/assets/version.json
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Commit APK to repo
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          mkdir -p dist
          rm -f dist/*.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/khartkum-v$V.apk"
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A dist
          git commit -m "Build: update APK v$V [skip ci]" || exit 0
          git push
