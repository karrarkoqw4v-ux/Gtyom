name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [claude/hala-yweuvu, main]
    paths: ["android/**", "index.html", ".github/workflows/android.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Copy UI into app
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: gtyom-ai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Commit APK to repo
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/gtyom-ai.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add dist/gtyom-ai.apk
          git commit -m "Build: update dist/gtyom-ai.apk [skip ci]" || exit 0
          git push
