<!doctype html>
<html lang="ar" dir="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد ذكي</title>
<style>
:root{
  --bg:#fff; --bg2:#f9f9f9; --side:#f9f9f9; --hover:#ececec; --border:#e5e5e5;
  --text:#0d0d0d; --muted:#6b6b6b; --user:#f4f4f4; --accent:#0d0d0d; --accent-text:#fff;
  --code:#0d0d0d; --code-text:#f5f5f5; --shadow:0 2px 14px rgba(0,0,0,.08);
}
:root[data-theme="dark"]{
  --bg:#212121; --bg2:#2a2a2a; --side:#171717; --hover:#2f2f2f; --border:#3a3a3a;
  --text:#ececec; --muted:#a0a0a0; --user:#2f2f2f; --accent:#fff; --accent-text:#0d0d0d;
  --code:#0d0d0d; --code-text:#f5f5f5; --shadow:0 2px 14px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;background:var(--bg);color:var(--text);
  display:flex;overflow:hidden;-webkit-font-smoothing:antialiased;transition:background .25s,color .25s}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sidebar */
#side{width:268px;background:var(--side);display:flex;flex-direction:column;padding:10px;gap:6px;
  transition:margin .28s cubic-bezier(.4,0,.2,1),transform .28s cubic-bezier(.4,0,.2,1);z-index:30;flex:none}
#side.closed{margin-inline-start:-268px}
.sbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;width:100%;text-align:start;transition:background .15s}
.sbtn:hover{background:var(--hover)}
#chats{flex:1;overflow-y:auto;margin-top:8px}
.sec{font-size:12px;color:var(--muted);padding:12px 12px 6px}
.chat{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:14px;gap:6px}
.chat span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.chat:hover,.chat.on{background:var(--hover)}
.chat .del{opacity:0;color:var(--muted);padding:2px}
.chat:hover .del{opacity:1}
.chat .del:hover{color:var(--text)}

/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;min-height:54px}
header .title{font-weight:600;font-size:16px;padding:6px 10px;border-radius:10px}
.ibtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;transition:background .15s}
.ibtn:hover{background:var(--hover)}
.sp{flex:1}
#scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}

/* welcome */
#welcome{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:20px;animation:fade .5s}
#welcome h1{font-size:28px;font-weight:600;text-align:center}
.logo{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center}
.logo svg{width:28px;height:28px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:640px}
.card{border:1px solid var(--border);border-radius:14px;padding:14px 16px;text-align:start;font-size:14px;line-height:1.5;transition:background .15s,transform .15s}
.card:hover{background:var(--hover);transform:translateY(-2px)}
.card small{display:block;color:var(--muted);margin-top:2px}

/* messages */
.msg{display:flex;gap:14px;padding:14px 0;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.msg.user{justify-content:flex-start;flex-direction:row-reverse}
.msg.user .body{background:var(--user);border-radius:20px;padding:10px 18px;max-width:80%}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none;margin-top:2px}
.av svg{width:16px;height:16px}
.body{line-height:1.8;font-size:15.5px;min-width:0;overflow-wrap:anywhere;unicode-bidi:plaintext}
.body p{margin:.5em 0}
.body ul,.body ol{margin:.5em 0;padding-inline-start:1.6em}
.body h1,.body h2,.body h3{margin:.8em 0 .3em;line-height:1.4}
.body code{background:var(--hover);padding:1px 6px;border-radius:6px;font-size:.9em;direction:ltr;unicode-bidi:isolate}
.body pre{background:var(--code);color:var(--code-text);border-radius:12px;margin:.8em 0;overflow:hidden;direction:ltr;text-align:left}
.body pre .ph{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;background:#2f2f2f;font-size:12px;color:#ccc}
.body pre code{display:block;background:none;padding:14px;overflow-x:auto;font-size:13.5px;line-height:1.6;color:inherit}
.body a{color:inherit;text-decoration:underline}
.body blockquote{border-inline-start:3px solid var(--border);padding-inline-start:12px;color:var(--muted);margin:.6em 0}
.copyc{color:#ccc;font-size:12px}
.acts{display:flex;gap:2px;margin-top:6px;opacity:0;transition:opacity .2s}
.msg:hover .acts,.msg:last-child .acts{opacity:1}
.acts .ibtn{width:30px;height:30px;color:var(--muted)}
.acts .ibtn svg{width:16px;height:16px}
.acts .ibtn:hover{color:var(--text)}
.dots{display:inline-flex;gap:5px;padding:10px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.cur::after{content:"";display:inline-block;width:8px;height:18px;background:var(--text);margin-inline-start:3px;vertical-align:text-bottom;animation:bl 1s steps(2) infinite}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.fchip{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:4px 10px;font-size:12.5px;max-width:200px}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip img{width:28px;height:28px;border-radius:6px;object-fit:cover}
.fchip button{color:var(--muted)}

/* composer */
#comp{padding:6px 18px calc(14px + env(safe-area-inset-bottom))}
.box{max-width:760px;margin:0 auto;background:var(--bg2);border:1px solid var(--border);border-radius:26px;padding:8px 10px;box-shadow:var(--shadow);transition:border-color .2s}
.box:focus-within{border-color:var(--muted)}
.row{display:flex;align-items:flex-end;gap:4px}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.6;max-height:200px;padding:8px 6px;unicode-bidi:plaintext}
textarea::placeholder{color:var(--muted)}
#send{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-text);display:grid;place-items:center;flex:none;transition:opacity .2s,transform .15s}
#send:disabled{opacity:.25;cursor:default}
#send:not(:disabled):hover{transform:scale(1.07)}
#mic.rec{color:#e5484d;animation:pulse 1.2s infinite}
.note{text-align:center;font-size:12px;color:var(--muted);margin-top:8px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex;animation:fade .2s}
.dlg{background:var(--bg);border:1px solid var(--border);border-radius:18px;width:100%;max-width:460px;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.dlg h2{font-size:18px}
.dlg label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.dlg input,.dlg select{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font:inherit;font-size:14px;outline:0;direction:ltr}
.dlg input:focus,.dlg select:focus{border-color:var(--muted)}
.dlg .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pbtn{background:var(--accent);color:var(--accent-text);padding:9px 18px;border-radius:10px;font-weight:600}
.gbtn{padding:9px 18px;border-radius:10px;border:1px solid var(--border)}
.hint{font-size:12px;color:var(--muted);line-height:1.6;direction:rtl}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--accent);color:var(--accent-text);padding:8px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#ov{display:none}
@media(max-width:820px){
  #side{position:fixed;inset-block:0;inset-inline-start:0;margin-inline-start:0;transform:translateX(100%);box-shadow:var(--shadow)}
  html[dir=ltr] #side,[dir=ltr] #side{transform:translateX(-100%)}
  #side.open{transform:none!important}
  #side.closed{margin:0}
  #ov.on{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
  .cards{grid-template-columns:1fr}
  #welcome h1{font-size:23px}
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes b{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes bl{50%{opacity:0}}
@keyframes pulse{50%{opacity:.4}}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
</style>
</head>
<body>

<svg style="display:none">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></symbol>

  <symbol id="i-clip" viewBox="0 0 24 24"><path d="M21 11l-9 9a6 6 0 01-9-9l9-9a4 4 0 016 6l-9 9a2 2 0 01-3-3l8-8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 012-2h9"/></symbol>
  <symbol id="i-spk" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM16 9a4 4 0 010 6M19 6a8 8 0 010 12"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0115-6l3 3M21 3v6h-6M21 12a9 9 0 01-15 6l-3-3M3 21v-6h6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-set" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 00-2-1.2L14.2 3h-4.4l-.4 2.6a7 7 0 00-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 000 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 002 1.2l.4 2.6h4.4l.4-2.6a7 7 0 002-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>

</svg>

<div id="ov"></div>

<aside id="side">
  <button class="sbtn" id="newChat"><svg><use href="#i-edit"/></svg><b>محادثة جديدة</b></button>
  <div id="chats"></div>
  <button class="sbtn" id="openSet"><svg><use href="#i-set"/></svg>الإعدادات</button>
</aside>

<main>
  <header>
    <button class="ibtn" id="toggle" aria-label="القائمة"><svg><use href="#i-menu"/></svg></button>
    <div class="title" id="mname">مساعد ذكي</div>
    <div class="sp"></div>
    <button class="ibtn" id="theme" aria-label="الوضع"><svg><use href="#i-sun"/></svg></button>
  </header>

  <div id="scroll"><div class="wrap" id="feed"></div></div>

  <div id="comp">
    <div class="box">
      <div class="files" id="files"></div>
      <div class="row">
        <button class="ibtn" id="attach" aria-label="إرفاق"><svg><use href="#i-clip"/></svg></button>
        <input type="file" id="fin" multiple hidden>
        <textarea id="inp" rows="1" placeholder="اسأل أي شيء..."></textarea>
        <button class="ibtn" id="mic" aria-label="إملاء صوتي"><svg><use href="#i-mic"/></svg></button>
        <button id="send" disabled aria-label="إرسال"><svg><use href="#i-send"/></svg></button>
      </div>
    </div>
    <div class="note">قد يخطئ المساعد. تحقق من المعلومات المهمة.</div>
  </div>
</main>

<div id="modal"><div class="dlg">
  <h2>الإعدادات</h2>
  <label>مصدر الردود
    <select id="mode">
      <option value="browser">Qwen داخل المتصفح (بدون مفتاح ولا سيرفر)</option>
      <option value="anthropic">Claude (Anthropic API)</option>
      <option value="api">API متوافق مع OpenAI</option>
      <option value="local">نموذجي المحلي (server.py)</option>
    </select>
  </label>
  <div id="fBrowser" style="display:flex;flex-direction:column;gap:14px">
    <label>حجم الموديل
      <select id="bModel">
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">1.5B — خفيف، للموبايل (~1 GB)</option>
        <option value="Qwen2.5-3B-Instruct-q4f16_1-MLC">3B — أذكى (~2 GB)</option>
        <option value="Qwen2.5-7B-Instruct-q4f16_1-MLC">7B — الأذكى، للكمبيوتر القوي (~5 GB)</option>
      </select></label>
    <p class="hint">أول رد ينزّل الموديل مرة وحدة ويُحفظ بجهازك، وبعدها يشتغل بدون إنترنت تقريباً. يحتاج متصفح يدعم WebGPU (Chrome حديث).</p>
  </div>
  <div id="fAnth" style="display:flex;flex-direction:column;gap:14px">
    <label>رابط الـ Worker (موصى به، بدون مفتاح بالمتصفح)<input id="anthUrl" placeholder="https://xxx.workers.dev"></label>
    <label>أو مفتاح Anthropic API مباشر<input id="anthKey" type="password" placeholder="sk-ant-..."></label>
    <label>الموديل<input id="anthModel" placeholder="claude-sonnet-5-5"></label>
  </div>
  <div id="fLocal">
    <label>رابط السيرفر المحلي<input id="localUrl" placeholder="http://localhost:8000"></label>
  </div>
  <div id="fApi" hidden style="display:flex;flex-direction:column;gap:14px">
    <label>رابط API<input id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions"></label>
    <label>المفتاح (API Key)<input id="apiKey" type="password" placeholder="sk-..."></label>
    <label>اسم الموديل<input id="apiModel" placeholder="gpt-4o-mini"></label>
  </div>
  <label>تعليمات النظام<input id="sys" placeholder="أنت مساعد ذكي ومفيد." style="direction:rtl"></label>
  <label>لغة الصوت<select id="lang"><option value="ar-IQ">العربية (العراق)</option><option value="ar-SA">العربية (السعودية)</option><option value="ar-EG">العربية (مصر)</option><option value="en-US">English</option></select></label>
  <p class="hint">المفتاح والمحادثات تُحفظ في متصفحك فقط ولا تُرفع لأي مكان.</p>
  <div class="btns"><button class="gbtn" id="clearAll">حذف كل المحادثات</button><button class="pbtn" id="saveSet">حفظ</button></div>
</div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const ic=n=>`<svg><use href="#i-${n}"/></svg>`;
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

let chats=LS.get('chats',[]), cur=null, busy=false, abortC=null, files=[], typing=null;
let cfg=Object.assign({mode:'browser',bModel:'Qwen2.5-1.5B-Instruct-q4f16_1-MLC',anthropicUrl:'',anthropicKey:'',anthropicModel:'claude-sonnet-5-5',localUrl:'http://localhost:8000',apiUrl:'',apiKey:'',apiModel:'gpt-4o-mini',sys:'أنت مساعد ذكي ومفيد. أجب بنفس لغة المستخدم، وبالعربية الفصحى أو بلهجة المستخدم إذا كتب بلهجة، بشكل واضح ومفصّل.',lang:'ar-IQ'},LS.get('cfg',{}));
const save=()=>LS.set('chats',chats);

/* ---------- utils ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1800)}
function md(src){
  const blocks=[];
  src=src.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(_,l,c)=>{blocks.push(`<pre><div class="ph"><span>${esc(l||'code')}</span><button class="copyc" data-copy>نسخ</button></div><code>${esc(c.replace(/\n$/,''))}</code></pre>`);return `\u0000${blocks.length-1}\u0000`});
  let h=esc(src);
  h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>')
     .replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')
     .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>')
     .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>')
     .replace(/^&gt; (.+)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/(?:^[-*] .+(?:\n|$))+/gm,m=>'<ul>'+m.trim().split('\n').map(l=>`<li>${l.replace(/^[-*] /,'')}</li>`).join('')+'</ul>');
  h=h.replace(/(?:^\d+\. .+(?:\n|$))+/gm,m=>'<ol>'+m.trim().split('\n').map(l=>`<li>${l.replace(/^\d+\. /,'')}</li>`).join('')+'</ol>');
  h=h.split(/\n{2,}/).map(p=>/^\s*<(h\d|ul|ol|blockquote|pre|\u0000)/.test(p)||/^\u0000/.test(p)?p:`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
  return h.replace(/\u0000(\d+)\u0000/g,(_,i)=>blocks[i]);
}

/* ---------- state / render ---------- */
function active(){return chats.find(c=>c.id===cur)}
function newChat(){cur=null;files=[];renderFiles();render();renderList();closeSide();$('#inp').focus()}
function renderList(){
  const el=$('#chats');
  el.innerHTML=chats.length?'<div class="sec">المحادثات</div>':'';
  chats.forEach(c=>{
    const d=document.createElement('div');d.className='chat'+(c.id===cur?' on':'');
    d.innerHTML=`<span>${esc(c.title)}</span><button class="del" aria-label="حذف">${ic('trash')}</button>`;
    d.onclick=e=>{if(e.target.closest('.del')){chats=chats.filter(x=>x.id!==c.id);save();if(cur===c.id)cur=null;render();renderList();return}
      cur=c.id;render();renderList();closeSide()};
    el.appendChild(d);
  });
}
function render(){
  const f=$('#feed'),c=active();
  if(!c||!c.msgs.length){
    f.innerHTML=`<div id="welcome"><div class="logo">${ic('spark')}</div><h1>بشتغل لك بشنو اليوم؟</h1>
    <div class="cards">
      ${[['اشرح لي','كيف يشتغل الذكاء الاصطناعي ببساطة'],['اكتب كود','دالة بلغة Python ترتب قائمة'],['اكتب قصيدة','عن الليل والقمر'],['لخص لي','فكرة التعلم الآلي بثلاث نقاط']]
      .map(([a,b])=>`<button class="card" data-q="${a} ${b}"><b>${a}</b><small>${b}</small></button>`).join('')}
    </div></div>`;
    f.querySelectorAll('.card').forEach(b=>b.onclick=()=>send(b.dataset.q));
    return;
  }
  f.innerHTML='';c.msgs.forEach(m=>f.appendChild(msgEl(m)));
  scrollDown(true);
}
function msgEl(m){
  const d=document.createElement('div');d.className='msg '+m.role;
  if(m.role==='user'){
    const fl=(m.files||[]).map(x=>`<div class="fchip">${x.img?`<img src="${x.img}">`:ic('clip')}<span>${esc(x.name)}</span></div>`).join('');
    d.innerHTML=`<div class="body">${fl?`<div class="files">${fl}</div>`:''}${esc(m.content).replace(/\n/g,'<br>')}</div>`;
  }else{
    d.innerHTML=`<div class="av">${ic('spark')}</div><div style="min-width:0;flex:1"><div class="body">${md(m.content)}</div>
    <div class="acts"><button class="ibtn" data-a="copy" title="نسخ">${ic('copy')}</button><button class="ibtn" data-a="speak" title="قراءة بصوت">${ic('spk')}</button><button class="ibtn" data-a="redo" title="إعادة التوليد">${ic('redo')}</button></div></div>`;
    d.querySelector('.acts').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;
      if(b.dataset.a==='copy'){navigator.clipboard?.writeText(m.content);toast('تم النسخ')}
      if(b.dataset.a==='speak')speak(m.content);
      if(b.dataset.a==='redo')regen()};
  }
  return d;
}
$('#feed').addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){navigator.clipboard?.writeText(b.closest('pre').querySelector('code').textContent);b.textContent='تم ✓';setTimeout(()=>b.textContent='نسخ',1500)}});
function scrollDown(force){const s=$('#scroll');if(force||s.scrollHeight-s.scrollTop-s.clientHeight<160)s.scrollTo({top:s.scrollHeight,behavior:force?'auto':'smooth'})}

/* ---------- sending ---------- */
async function send(text){
  text=(text??$('#inp').value).trim();
  if((!text&&!files.length)||busy)return;
  let c=active();
  if(!c){c={id:Date.now().toString(36),title:text.slice(0,40)||'محادثة جديدة',msgs:[]};chats.unshift(c);cur=c.id}
  const fcopy=files.map(f=>({name:f.name,img:f.img,text:f.text}));
  c.msgs.push({role:'user',content:text,files:fcopy});
  files=[];renderFiles();$('#inp').value='';autosize();upd();
  save();renderList();render();
  await reply(c);
}
async function regen(){
  const c=active();if(!c||busy)return;
  while(c.msgs.length&&c.msgs.at(-1).role==='assistant')c.msgs.pop();
  save();render();await reply(c);
}
async function reply(c){
  busy=true;upd();
  const m={role:'assistant',content:''};
  const el=msgEl(m);const body=el.querySelector('.body');el.querySelector('.acts').style.display='none';
  body.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';
  $('#feed').appendChild(el);scrollDown(true);
  abortC=new AbortController();
  const push=t=>{if(!m.content)body.classList.add('cur');m.content+=t;body.innerHTML=md(m.content);scrollDown()};
  try{
    const hist=c.msgs.map(x=>({role:x.role,content:x.content+((x.files||[]).filter(f=>f.text).map(f=>`\n\n[ملف: ${f.name}]\n${f.text}`).join(''))}));
    if(cfg.mode==='browser')await viaBrowser(hist,push,abortC.signal,t=>{body.innerHTML='<p>'+esc(t)+'</p>'});
    else if(cfg.mode==='api')await viaApi(hist,push,abortC.signal);
    else if(cfg.mode==='anthropic')await viaAnthropic(hist,push,abortC.signal);
    else await viaLocal(hist,push,abortC.signal);
  }catch(e){
    if(e.name!=='AbortError')push((m.content?'\n\n':'')+'⚠️ تعذّر الاتصال: '+e.message+'\n\nافتح الإعدادات وتأكد من المصدر.');
  }
  body.classList.remove('cur');
  if(!m.content)m.content='...';
  body.innerHTML=md(m.content);el.querySelector('.acts').style.display='';
  c.msgs.push(m);save();busy=false;abortC=null;upd();
}

/* typewriter for non-streaming sources */
async function type(text,push,sig){
  const parts=text.match(/\s*\S+/g)||[text];
  for(const p of parts){if(sig.aborted)throw new DOMException('','AbortError');push(p);await new Promise(r=>setTimeout(r,18+Math.random()*22))}
}
async function viaLocal(h,push,sig){
  const last=h.at(-1).content;
  const r=await fetch(cfg.localUrl.replace(/\/$/,'')+'/generate',{method:'POST',headers:{'Content-Type':'application/json'},signal:sig,
    body:JSON.stringify({prompt:last,history:h,max_tokens:300})});
  if(!r.ok)throw new Error('السيرفر رد بـ '+r.status);
  const j=await r.json();await type(j.text||j.reply||'(رد فارغ)',push,sig);
}
async function viaApi(h,push,sig){
  if(!cfg.apiUrl)throw new Error('رابط API غير مضبوط');
  const r=await fetch(cfg.apiUrl,{method:'POST',signal:sig,headers:{'Content-Type':'application/json',...(cfg.apiKey?{Authorization:'Bearer '+cfg.apiKey}:{})},
    body:JSON.stringify({model:cfg.apiModel,stream:true,messages:[{role:'system',content:cfg.sys},...h]})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){const t=l.trim();if(!t.startsWith('data:'))continue;const d=t.slice(5).trim();if(d==='[DONE]')return;
      try{const j=JSON.parse(d);const x=j.choices?.[0]?.delta?.content??j.choices?.[0]?.message?.content;if(x)push(x)}catch{}}}
}
let engine=null,engineModel=null;
async function viaBrowser(h,push,sig,status){
  if(!navigator.gpu)throw new Error('متصفحك لا يدعم WebGPU. استخدم Chrome حديث، أو اختر مصدراً ثانياً من الإعدادات');
  if(!engine||engineModel!==cfg.bModel){
    status('جاري تحميل المكتبة...');
    const webllm=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm');
    engine=await webllm.CreateMLCEngine(cfg.bModel,{initProgressCallback:r=>status('جاري تجهيز الموديل: '+Math.round((r.progress||0)*100)+'% — '+(r.text||'')),});
    engineModel=cfg.bModel;
  }
  sig.addEventListener('abort',()=>engine.interruptGenerate());
  const it=await engine.chat.completions.create({stream:true,temperature:0.7,max_tokens:2048,messages:[{role:'system',content:cfg.sys},...h]});
  for await(const c of it){const x=c.choices[0]?.delta?.content;if(x)push(x);if(sig.aborted)break}
}
async function viaAnthropic(h,push,sig){
  if(!cfg.anthropicUrl&&!cfg.anthropicKey)throw new Error('ضع رابط الـ Worker أو مفتاح Anthropic من الإعدادات');
  const direct=!cfg.anthropicUrl;
  const r=await fetch(direct?'https://api.anthropic.com/v1/messages':cfg.anthropicUrl,{method:'POST',signal:sig,headers:direct?{'Content-Type':'application/json','x-api-key':cfg.anthropicKey,
    'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}:{'Content-Type':'application/json'},
    body:JSON.stringify({model:cfg.anthropicModel,max_tokens:4096,stream:true,system:cfg.sys,messages:h})});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,200));
  const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
    const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){const t=l.trim();if(!t.startsWith('data:'))continue;
      try{const j=JSON.parse(t.slice(5));if(j.type==='content_block_delta'&&j.delta?.text)push(j.delta.text)}catch{}}}
}

/* ---------- composer ---------- */
const inp=$('#inp');
function autosize(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,200)+'px'}
function upd(){const s=$('#send');
  if(busy){s.disabled=false;s.innerHTML=ic('stop');s.onclick=()=>abortC?.abort();}
  else{s.innerHTML=ic('send');s.disabled=!(inp.value.trim()||files.length);s.onclick=()=>send();}}
inp.addEventListener('input',()=>{autosize();upd()});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&innerWidth>820){e.preventDefault();if(!busy)send()}});

/* files */
$('#attach').onclick=()=>$('#fin').click();
$('#fin').onchange=async e=>{
  for(const f of e.target.files){
    if(f.size>5e6){toast('الملف كبير: '+f.name);continue}
    const o={name:f.name};
    if(f.type.startsWith('image/'))o.img=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});
    else if(/^text\/|json|xml|javascript|csv|markdown/.test(f.type)||/\.(txt|md|csv|json|py|js|html|css|ts)$/i.test(f.name))o.text=(await f.text()).slice(0,20000);
    files.push(o);
  }
  e.target.value='';renderFiles();upd();
};
function renderFiles(){
  const el=$('#files');el.innerHTML='';
  files.forEach((f,i)=>{const d=document.createElement('div');d.className='fchip';
    d.innerHTML=`${f.img?`<img src="${f.img}">`:ic('clip')}<span>${esc(f.name)}</span><button aria-label="إزالة">${ic('x')}</button>`;
    d.querySelector('button').onclick=()=>{files.splice(i,1);renderFiles();upd()};el.appendChild(d)});
  el.style.display=files.length?'flex':'none';
}

/* voice: dictation + read aloud */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('#mic').onclick=()=>{
  if(!SR){toast('المتصفح لا يدعم الإملاء الصوتي');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.lang=cfg.lang;rec.interimResults=true;rec.continuous=true;
  const base=inp.value;let fin='';
  rec.onresult=e=>{let t='';for(const r of e.results){if(r.isFinal)fin+=r[0].transcript;else t+=r[0].transcript}
    inp.value=(base?base+' ':'')+fin+t;autosize();upd()};
  rec.onerror=()=>toast('تعذّر الوصول للمايك');
  rec.onend=()=>{rec=null;$('#mic').classList.remove('rec')};
  rec.start();$('#mic').classList.add('rec');
};
function speak(t){
  if(!('speechSynthesis' in window)){toast('القراءة الصوتية غير مدعومة');return}
  if(speechSynthesis.speaking){speechSynthesis.cancel();return}
  const u=new SpeechSynthesisUtterance(t.replace(/```[\s\S]*?```/g,' ').replace(/[*#`>]/g,''));u.lang=cfg.lang;speechSynthesis.speak(u);
}

/* ---------- ui ---------- */
const side=$('#side'),mobile=()=>innerWidth<=820;
function closeSide(){if(mobile()){side.classList.remove('open');$('#ov').classList.remove('on')}}
$('#toggle').onclick=()=>{
  if(mobile()){side.classList.toggle('open');$('#ov').classList.toggle('on',side.classList.contains('open'))}
  else side.classList.toggle('closed');
};
$('#ov').onclick=closeSide;
$('#newChat').onclick=newChat;
function setTheme(t){document.documentElement.dataset.theme=t;LS.set('theme',t)}
setTheme(LS.get('theme',matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
$('#theme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

function modeUI(){const m=$('#mode').value;$('#fBrowser').style.display=m==='browser'?'flex':'none';$('#fLocal').style.display=m==='local'?'block':'none';$('#fAnth').style.display=m==='anthropic'?'flex':'none';$('#fApi').style.display=m==='api'?'flex':'none'}
$('#mode').onchange=modeUI;
$('#openSet').onclick=()=>{
  $('#mode').value=cfg.mode;$('#bModel').value=cfg.bModel;$('#anthKey').value=cfg.anthropicKey;$('#anthUrl').value=cfg.anthropicUrl;$('#anthModel').value=cfg.anthropicModel;$('#localUrl').value=cfg.localUrl;$('#apiUrl').value=cfg.apiUrl;$('#apiKey').value=cfg.apiKey;
  $('#apiModel').value=cfg.apiModel;$('#sys').value=cfg.sys;$('#lang').value=cfg.lang;modeUI();$('#modal').classList.add('on');closeSide();
};
$('#saveSet').onclick=()=>{
  cfg={mode:$('#mode').value,bModel:$('#bModel').value,anthropicKey:$('#anthKey').value.trim(),anthropicUrl:$('#anthUrl').value.trim(),anthropicModel:$('#anthModel').value.trim()||'claude-sonnet-5-5',localUrl:$('#localUrl').value.trim(),apiUrl:$('#apiUrl').value.trim(),apiKey:$('#apiKey').value.trim(),
    apiModel:$('#apiModel').value.trim(),sys:$('#sys').value.trim(),lang:$('#lang').value};
  LS.set('cfg',cfg);$('#modal').classList.remove('on');toast('تم الحفظ');
};
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('on')};
$('#clearAll').onclick=()=>{if(confirm('حذف كل المحادثات؟')){chats=[];save();cur=null;render();renderList();$('#modal').classList.remove('on')}};
if(mobile())side.classList.add('closed');
renderFiles();render();renderList();upd();
</script>
